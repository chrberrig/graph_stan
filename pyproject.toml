[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-stan"
version = "0.1.0"
description = "Visualize Stan model dependency graphs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "graphviz", 
]

[project.optional-dependencies]
dev = [
  "pytest", 
  "ruff", 
  "mypy", 
]

[project.scripts]
graph-stan = "graph_stan.refactor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
